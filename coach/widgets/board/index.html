<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Postgame Coach board</title>
    <style>
      :root {
        --pg-text: #1f2328;
        --pg-muted: #59636e;
        --pg-border: #d0d7de;
        --pg-button-bg: #f6f8fa;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --pg-text: #e6edf3;
          --pg-muted: #9198a1;
          --pg-border: #3d444d;
          --pg-button-bg: #212830;
        }
      }
      :root[data-theme='dark'] {
        --pg-text: #e6edf3;
        --pg-muted: #9198a1;
        --pg-border: #3d444d;
        --pg-button-bg: #212830;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        color: var(--pg-text);
        font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
